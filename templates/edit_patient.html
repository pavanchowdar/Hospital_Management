<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 20px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        a {
        display: block;
        text-align: center;
        margin-top: 20px;
        text-decoration: none;
        color: #007BFF;
        font-weight: bold;
    }

    a:hover {
        color: #0056b3;
    }


        button {
            width: 100%;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back-button {
            background-color: #6c757d;
            margin-top: 10px;
        }

        .back-button:hover {
            background-color: #5a6268;
        }

        p {
            text-align: center;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
{% block content %}
    <h1>Edit Patient Details</h1>
    <form method="POST" action="{{ url_for('edit_patient', patient_id=patient['id']) }}">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ patient['name'] }}" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="{{ patient['age'] }}" required>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="Male" {% if patient['gender'] == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if patient['gender'] == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if patient['gender'] == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ patient['email'] }}" required>

        <button type="submit">Update Details</button>
    </form>

    <a href="{{ url_for('view_patients') }}">Back to Patients List</a>
  
    <p>{{ get_flashed_messages()|join(', ') }}</p>
{% endblock %}
</body>
</html>
