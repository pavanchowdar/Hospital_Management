{% block content %}
<h1 style="text-align: center; color: #333;">Patients</h1>

<table style="width: 80%; margin: 20px auto; border-collapse: collapse; text-align: left; border: 1px solid #ddd;">
    <thead>
        <tr style="background-color: #007BFF; color: white;">
            <th style="padding: 10px; border: 1px solid #ddd;">ID</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Name</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Age</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Gender</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Email</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for patient in patients %}
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd;">{{ patient['id'] }}</td>
            <td style="padding: 10px; border: 1px solid #ddd;">{{ patient['name'] }}</td>
            <td style="padding: 10px; border: 1px solid #ddd;">{{ patient['age'] }}</td>
            <td style="padding: 10px; border: 1px solid #ddd;">{{ patient['gender'] }}</td>
            <td style="padding: 10px; border: 1px solid #ddd;">{{ patient['email'] }}</td>
            <td style="padding: 10px; border: 1px solid #ddd;">
                <a href="{{ url_for('edit_patient', patient_id=patient['id']) }}" 
                   style="color: #007BFF; text-decoration: none; margin-right: 10px;">Edit</a> |
                <a href="{{ url_for('delete_patient', patient_id=patient['id']) }}" 
                   onclick="return confirm('Are you sure you want to delete this patient?')" 
                   style="color: red; text-decoration: none; margin-left: 10px;">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div style="text-align: center; margin: 20px;">
    <button onclick="window.location.href='{{ url_for('admin_dashboard') }}'"
            style="padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Back
    </button>
</div>

<p style="text-align: center; color: red; font-weight: bold;">{{ get_flashed_messages()|join(', ') }}</p>
{% endblock %}
